<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}航空气象报文综合监控告警系统{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body>
  <script>
    (function () {
      var raw = '{{ alert_colors_json|default:""|escapejs }}';
      var colors = null;
      try { colors = raw ? JSON.parse(raw) : null; } catch (e) { colors = null; }
      window.MTWS_ALERT_COLORS = colors;
      if (!colors) return;
      var root = document.documentElement;
      ['R', 'Y', 'G', 'N'].forEach(function (k) {
        var c = colors[k];
        if (!c) return;
        var key = k.toLowerCase();
        if (c.hex) root.style.setProperty('--alert-' + key, c.hex);
        if (c.rgb) root.style.setProperty('--alert-' + key + '-rgb', c.rgb);
      });
    })();
  </script>
  {% block content %}{% endblock %}

  <script src="{% static 'js/echarts.min.js' %}"></script>
  <script src="{% static 'js/main_metar.js' %}"></script>
  <script src="{% static 'js/main_taf.js' %}"></script>
  <script src="{% static 'js/main_flight.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/settings.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>

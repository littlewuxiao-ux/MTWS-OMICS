<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forecast Widget Bundle Demo</title>
  </head>
  <body style="margin:0;background:#0b1326;color:#e9f1ff;font-family:Segoe UI,Microsoft YaHei,sans-serif;">
    <div style="max-width:980px;margin:24px auto;padding:0 16px;">
      <h2 style="margin:0 0 10px;">要素展示（单文件 Bundle 版）</h2>
      <div id="mount"></div>
    </div>
    <script src="./forecast-widget.bundle.js"></script>
    <script>
      window.ForecastWidget.create({
        mount: document.getElementById("mount"),
        overridesUrl: "../../icao-airport-overrides.json",
        defaultCode: "ZBAA",
      });
    </script>
  </body>
  </html>
